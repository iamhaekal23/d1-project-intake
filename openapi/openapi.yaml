openapi: 3.0.3
info:
  title: Modul D-1 - Registrasi Proyek dan Project Intake API
  description: >
    Spesifikasi OpenAPI Versi Awal untuk modul Registrasi Proyek dan Project Intake 
    (ERP PT Anaheim Nimbus Universal). Menyediakan endpoint kanonis proyek terpusat 
    (single source of truth) untuk dikonsumsi oleh modul komersial (E-2), baseline 
    dan perencanaan (E-3), pengawasan risiko (E-5), dan penutupan proyek (D-3).
  version: 0.1.0
  contact:
    name: Tim Pengembang D-1 (Kelompok 1 - Kelas D)
    email: dev-d1@anaheim.local

servers:
  - url: http://127.0.0.1:4010
    description: Lingkungan Mock Server Lokal (Prism)
  - url: http://localhost:3000/api/v1
    description: Lingkungan Pengembangan Lokal

security:
  - BearerAuth: []

paths:
  /projects/{projectId}:
    get:
      summary: Ambil data proyek kanonis tunggal
      description: >
        Operasi utama (API-K01-07) untuk mengambil rincian data proyek kanonis terverifikasi. 
        Penanda komersial poReceived digunakan oleh modul E-2 untuk mengunci atau mengizinkan 
        penerbitan termin tagihan.
      operationId: getCanonicalProjectById
      tags:
        - Proyek Kanonis
      parameters:
        - name: projectId
          in: path
          required: true
          description: Pengenal unik proyek berformat UUID v7 kanonis
          schema:
            type: string
            format: uuid
            example: "01924b1e-7f32-7a81-9b12-45e8a1234567"
      responses:
        '200':
          description: Data proyek kanonis berhasil ditemukan dan dikembalikan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCanonicalResponse'
              examples:
                ProjectRegisteredSuccess:
                  summary: Proyek terdaftar dengan penanda PO belum ada
                  value:
                    projectId: "01924b1e-7f32-7a81-9b12-45e8a1234567"
                    canonicalCode: "202601"
                    projectName: "Implementasi Sistem ERP Cloud Anaheim Tahap 1"
                    clientId: "PTANTRI"
                    clientName: "PT Anaheim Nimbus Universal"
                    amEmployeeId: "SDM-0012"
                    pmEmployeeId: "SDM-0004"
                    startDate: "2026-10-15"
                    targetEndDate: "2027-04-15"
                    documentsComplete: true
                    poReceived: false
                    status: "REGISTERED"
                    createdAt: "2026-10-13T09:00:00+07:00"
                    updatedAt: "2026-10-13T11:30:00+07:00"
        '400':
          description: Format parameter projectId tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                InvalidUUID:
                  summary: Kesalahan sintaks ID
                  value:
                    code: "INVALID_PROJECT_ID_FORMAT"
                    message: "Parameter projectId harus berupa UUID v7 yang sah"
                    details:
                      parameter: "projectId"
        '401':
          description: Token autentikasi tidak disertakan atau telah kedaluwarsa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Unauthorized:
                  summary: Token tidak sah
                  value:
                    code: "UNAUTHORIZED"
                    message: "Token autentikasi tidak ditemukan atau telah kedaluwarsa"
        '403':
          description: Peran pengguna tidak memiliki hak akses membaca data proyek
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                Forbidden:
                  summary: Akses ditolak
                  value:
                    code: "FORBIDDEN"
                    message: "Akun tidak memiliki izin untuk mengakses resource proyek ini"
        '404':
          description: Data proyek tidak ditemukan di sistem intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NotFound:
                  summary: Proyek tidak ditemukan
                  value:
                    code: "PROJECT_NOT_FOUND"
                    message: "Data proyek dengan ID 01924b1e-7f32-7a81-9b12-999999999999 tidak ditemukan di sistem intake"
                    details:
                      requestedProjectId: "01924b1e-7f32-7a81-9b12-999999999999"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token Bearer JWT diterbitkan oleh modul F-1 (Identitas & Hak Akses) 
        melalui endpoint POST /api/v1/auth/login.

  schemas:
    ProjectStatusEnum:
      type: string
      description: Siklus hidup status resmi proyek intake
      enum:
        - DRAFT
        - UNDER_REVIEW
        - REVISI_HANDOVER
        - REGISTERED
      example: "REGISTERED"

    ProjectCanonicalResponse:
      type: object
      description: Skema data proyek kanonis terpusat untuk modul konsumen
      required:
        - projectId
        - canonicalCode
        - projectName
        - clientId
        - clientName
        - amEmployeeId
        - pmEmployeeId
        - startDate
        - targetEndDate
        - documentsComplete
        - poReceived
        - status
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          format: uuid
          description: Primary Key unik proyek (UUID v7 diterbitkan D-1)
          example: "01924b1e-7f32-7a81-9b12-45e8a1234567"
        canonicalCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: Kode unik kanonis format tahunan YYYYXX (contoh 202601)
          example: "202601"
        projectName:
          type: string
          minLength: 5
          maxLength: 150
          description: Nama resmi paket proyek
          example: "Implementasi Sistem ERP Cloud Anaheim Tahap 1"
        clientId:
          type: string
          description: Kode klien resmi dari CRM F-6 atau ID penampung draf sementara
          example: "PTANTRI"
        clientName:
          type: string
          description: Nama instansi perusahaan klien pemesan
          example: "PT Anaheim Nimbus Universal"
        amEmployeeId:
          type: string
          description: Referensi identitas karyawan Account Manager dari modul F-2
          example: "SDM-0012"
        pmEmployeeId:
          type: string
          description: Referensi identitas karyawan Project Manager dari modul F-2
          example: "SDM-0004"
        startDate:
          type: string
          format: date
          description: Estimasi tanggal mulai administratif (ISO 8601 YYYY-MM-DD)
          example: "2026-10-15"
        targetEndDate:
          type: string
          format: date
          description: Estimasi target tanggal selesai administratif (ISO 8601 YYYY-MM-DD)
          example: "2027-04-15"
        documentsComplete:
          type: boolean
          description: Penanda sakelar (toggle) kelengkapan berkas acuan kerja WI-01
          example: true
        poReceived:
          type: boolean
          description: >
            Flag ketersediaan fisik PO. Jika false, modul E-2 memblokir penerbitan termin tagihan.
          example: false
        status:
          $ref: '#/components/schemas/ProjectStatusEnum'
        createdAt:
          type: string
          format: date-time
          description: Waktu pencatatan sistem (ISO 8601 UTC+7 / WIB)
          example: "2026-10-13T09:00:00+07:00"
        updatedAt:
          type: string
          format: date-time
          description: Waktu perubahan terakhir (ISO 8601 UTC+7 / WIB)
          example: "2026-10-13T11:30:00+07:00"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Kode klasifikasi error teknis
          example: "PROJECT_NOT_FOUND"
        message:
          type: string
          description: Pesan penjelasan human-readable
          example: "Data proyek dengan ID tersebut tidak ditemukan di sistem intake"
        details:
          type: object
          description: Objek detail konteks kesalahan tambahan
          additionalProperties: true
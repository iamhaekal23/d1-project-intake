openapi: 3.0.3
info:
  title: Modul D-1 - Registrasi Proyek dan Project Intake API
  description: >-
    Spesifikasi Kontrak REST API Resmi untuk Modul Registrasi Proyek dan Project Intake (D-1), 
    Enterprise Resource Planning (ERP) PT Anaheim Nimbus Universal. Modul ini bertindak sebagai 
    Single Source of Truth (SSOT) data proyek kanonis bagi modul hilir (E-2, E-3, E-5, D-3).
    Kontrak ini dibekukan (Freeze) untuk Asesmen Tengah Semester (UTS).
  version: 0.2.0
  contact:
    name: "Tim Pengembang Kelompok 1-D (Lead API: Fikri Lazuardi Fadilla)"
    email: fikri@anaheim.local

servers:
  - url: http://localhost:3000/api/v1
    description: Server Aplikasi Lokal (Node.js Express)
  - url: http://127.0.0.1:4010/api/v1
    description: Mock Server Lokal (Prism CLI)

security:
  - BearerAuth: []

paths:
  # ============================================================================
  # API-K01-08: DAFTAR PROYEK KANONIS
  # ============================================================================
  /projects:
    get:
      summary: Mengambil daftar proyek kanonis terdaftar (Paging & Filter)
      description: >-
        Menyediakan koleksi data proyek kanonis dengan dukungan paginasi, pencarian nama/kode, 
        dan filter status. Digunakan oleh modul penagihan komersial E-2 untuk menampilkan opsi 
        proyek saat penyusunan kontrak/termin, serta oleh dasbor eksekutif E-1.
      operationId: listProjects
      tags:
        - Proyek Kanonis
      parameters:
        - name: page
          in: query
          description: Nomor halaman data yang diminta (mulai dari 1).
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: limit
          in: query
          description: Jumlah data per halaman.
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
          example: 10
        - name: status
          in: query
          description: Filter status siklus proyek.
          required: false
          schema:
            type: string
            enum:
              - DRAFT
              - UNDER_REVIEW
              - REVISI_HANDOVER
              - REGISTERED
          example: REGISTERED
        - name: q
          in: query
          description: Kata kunci pencarian berdasarkan nama proyek atau kode kanonis.
          required: false
          schema:
            type: string
          example: ERP Cloud
      responses:
        '200':
          description: Daftar proyek kanonis berhasil diambil beserta metadata paginasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '400':
          description: Parameter kueri tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Akses ditolak. Token autentikasi tidak disertakan atau kedaluwarsa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # API-K01-07: DETAIL TUNGGAL PROYEK KANONIS (Operasi Utama Konsumen Hilir)
  # ============================================================================
  /projects/{projectId}:
    get:
      summary: Mengambil rincian data tunggal proyek kanonis terpusat
      description: >-
        Mengembalikan metadata kanonis terverifikasi untuk satu proyek berdasarkan UUID v7 atau 
        kode kanonis. Dikonsumsi oleh modul perencanaan teknis (E-3), penagihan invoice & termin (E-2), 
        pengawasan risiko (E-5), evaluasi penutupan (D-3), dan finansial (E-1).
      operationId: getProjectById
      tags:
        - Proyek Kanonis
      parameters:
        - name: projectId
          in: path
          required: true
          description: Identifier unik proyek berupa string UUID v7 atau Kode Kanonis (YYYYXX).
          schema:
            type: string
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
      responses:
        '200':
          description: Data proyek kanonis ditemukan dan disajikan secara lengkap.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCanonicalResponse'
        '400':
          description: Format identifier projectId pada path tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Akses ditolak. Token JWT F-1 tidak disertakan atau tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Proyek dengan ID atau kode tersebut tidak terdaftar di sistem intake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token autentikasi JWT resmi yang diterbitkan oleh modul Identitas & Akun (F-1)."

  schemas:
    ProjectCanonicalResponse:
      type: object
      required:
        - projectId
        - canonicalCode
        - projectName
        - clientId
        - clientName
        - amEmployeeId
        - pmEmployeeId
        - startDate
        - targetEndDate
        - documentsComplete
        - poReceived
        - status
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          format: uuid
          description: Primary Key unik proyek yang diterbitkan sistem intake D-1 (format UUID v7).
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
        canonicalCode:
          type: string
          pattern: '^[0-9]{6}$'
          description: Nomor proyek kanonis resmi format tahunan YYYYXX (contoh 202601).
          example: "202601"
        projectName:
          type: string
          description: Nama paket inisiasi proyek resmi.
          example: Implementasi Sistem ERP Cloud Anaheim Tahap 1
        clientId:
          type: string
          description: Kode referensi instansi klien dari modul CRM F-6 (atau ID draf sementara).
          example: PTANTRI
        clientName:
          type: string
          description: Nama lengkap perusahaan atau instansi klien pemesan.
          example: PT Anaheim Nimbus Universal
        amEmployeeId:
          type: string
          description: Referensi ID penanggung jawab Account Manager (dari modul F-1 / F-2).
          example: 01929b4a-6e2a-7b3f-8c71-0ab4e3d9f2a1
        pmEmployeeId:
          type: string
          description: Referensi ID pegawai Project Manager yang ditunjuk (dari modul SDM F-2).
          example: SDM-0004
        startDate:
          type: string
          format: date
          description: Estimasi tanggal mulai administratif (ISO 8601 YYYY-MM-DD).
          example: "2026-10-15"
        targetEndDate:
          type: string
          format: date
          description: Estimasi target tanggal selesai administratif (ISO 8601 YYYY-MM-DD).
          example: "2027-04-15"
        documentsComplete:
          type: boolean
          description: Nilai sakelar (toggle switch) kelengkapan dokumen acuan kerja WI-01.
          example: true
        poReceived:
          type: boolean
          description: >-
            Flag ketersediaan dokumen fisik Purchase Order (PO). Jika bernilai false, 
            modul komersial E-2 mengunci penerbitan termin tagihan secara otomatis.
          example: false
        status:
          type: string
          enum:
            - DRAFT
            - UNDER_REVIEW
            - REVISI_HANDOVER
            - REGISTERED
          description: Siklus hidup status proyek.
          example: REGISTERED
        createdAt:
          type: string
          format: date-time
          description: Waktu inisiasi draf proyek dalam format ISO 8601 dengan zona WIB (+07:00).
          example: "2026-10-13T09:00:00+07:00"
        updatedAt:
          type: string
          format: date-time
          description: Waktu terakhir data diperbarui dengan zona WIB (+07:00).
          example: "2026-10-13T11:30:00+07:00"

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          description: Halaman data aktif saat ini.
          example: 1
        limit:
          type: integer
          description: Batas jumlah data yang ditampilkan per halaman.
          example: 10
        total:
          type: integer
          description: Total keseluruhan data proyek yang cocok dengan filter.
          example: 20
        totalPages:
          type: integer
          description: Total jumlah halaman yang tersedia.
          example: 2

    ProjectListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCanonicalResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Kode error standar sistem.
          example: PROJECT_NOT_FOUND
        message:
          type: string
          description: Deskripsi pesan kesalahan yang dapat dibaca manusia.
          example: Data proyek dengan ID tersebut tidak ditemukan di sistem intake
        details:
          type: object
          description: Informasi teknis tambahan mengenai kesalahan.
          additionalProperties: true

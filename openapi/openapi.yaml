openapi: 3.0.3
info:
  title: Modul D-1 - Registrasi Proyek dan Project Intake API
  description: >-
    Spesifikasi Kontrak REST API Resmi untuk Modul Registrasi Proyek dan Project Intake (D-1), 
    Enterprise Resource Planning (ERP) PT Anaheim Nimbus Universal. Modul ini bertindak sebagai 
    Single Source of Truth (SSOT) data proyek kanonis bagi modul hilir (E-2, E-3, E-5, D-3).
    Revisi v0.3.0 menyelaraskan temuan integrasi INT-01 s.d. INT-06 serta kebutuhan modul tata kelola E-5.
  version: 0.3.0
  contact:
    name: "Tim Pengembang Kelompok 1-D (Lead API: Fikri Lazuardi Fadilla)"
    email: fikri@anaheim.local

servers:
  - url: http://localhost:3000/api/v1
    description: Server Aplikasi Lokal (Node.js Express)
  - url: http://127.0.0.1:4010/api/v1
    description: Mock Server Lokal (Prism CLI)

security:
  - BearerAuth: []

paths:
  # ============================================================================
  # API-K01-08: DAFTAR PROYEK KANONIS DENGAN PAGING & FILTER
  # ============================================================================
  /projects:
    get:
      summary: Mengambil daftar proyek kanonis terdaftar (Paging & Filter)
      description: >-
        Menyediakan koleksi data proyek kanonis dengan dukungan paginasi, pencarian nama/kode, 
        dan filter status. Digunakan oleh modul penagihan komersial E-2 untuk menampilkan opsi 
        proyek saat penyusunan kontrak/termin, serta oleh dasbor eksekutif E-1.
      operationId: listProjects
      tags:
        - Proyek Kanonis
      parameters:
        - name: page
          in: query
          description: Nomor halaman data yang diminta (mulai dari 1).
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
          example: 1
        - name: limit
          in: query
          description: Jumlah data per halaman.
          required: false
          schema:
            type: integer
            default: 3
            minimum: 1
            maximum: 100
          example: 3
        - name: status
          in: query
          description: Filter status siklus proyek.
          required: false
          schema:
            type: string
            enum:
              - DRAFT
              - UNDER_REVIEW
              - REVISI_HANDOVER
              - REGISTERED
          example: REGISTERED
        - name: q
          in: query
          description: Kata kunci pencarian berdasarkan nama proyek, kode kanonis, atau nama klien.
          required: false
          schema:
            type: string
          example: Modernisasi
      responses:
        '200':
          description: Daftar proyek kanonis berhasil diambil beserta metadata paginasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '400':
          description: Parameter kueri tidak valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Akses ditolak. Token autentikasi tidak disertakan atau kedaluwarsa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # API-K01-07: DETAIL TUNGGAL PROYEK KANONIS (Operasi Utama Konsumen Hilir)
  # ============================================================================
  /projects/{projectId}:
    get:
      summary: Mengambil rincian data tunggal proyek kanonis terpusat
      description: >-
        Mengembalikan metadata kanonis terverifikasi untuk satu proyek berdasarkan UUID v7. 
        Dikonsumsi oleh modul perencanaan teknis (E-3), penagihan invoice & termin (E-2), 
        pengawasan risiko (E-5), evaluasi penutupan (D-3), dan finansial (E-1).
      operationId: getProjectById
      tags:
        - Proyek Kanonis
      parameters:
        - name: projectId
          in: path
          required: true
          description: Identifier unik proyek berupa string UUID v7 resmi RFC 9562.
          schema:
            type: string
            format: uuid
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
      responses:
        '200':
          description: Data proyek kanonis ditemukan dan disajikan tanpa overfetching data finansial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCanonicalResponse'
        '400':
          description: Format identifier projectId pada path tidak valid (bukan format UUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: INVALID_PROJECT_ID_FORMAT
                message: Format projectId 'abc' tidak valid. Parameter harus berupa UUID v7
                details:
                  requestedProjectId: abc
        '401':
          description: Akses ditolak. Header Authorization Bearer token tidak disertakan atau kosong.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: UNAUTHORIZED
                message: "Akses ditolak: Header Authorization Bearer token wajib disertakan"
                details:
                  header: Authorization
        '404':
          description: Proyek dengan ID tersebut tidak terdaftar di sistem intake.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: PROJECT_NOT_FOUND
                message: Data proyek dengan ID 01924b1e-7f32-7a81-9b12-45e8a1234567 tidak ditemukan di sistem intake
                details:
                  requestedProjectId: 01924b1e-7f32-7a81-9b12-45e8a1234567

  # ============================================================================
  # API-K01-09: UNDUH DOKUMEN BINER PDF PROJECT CHARTER (FTR-K01-08)
  # ============================================================================
  /projects/{projectId}/charter:
    get:
      summary: Mengunduh berkas biner PDF Project Charter ringkas
      description: >-
        Menerbitkan dan mengunduh berkas fisik PDF Project Charter resmi yang dibuat otomatis 
        oleh sistem D-1. Operasi ini hanya diizinkan untuk proyek yang telah berstatus REGISTERED.
      operationId: downloadProjectCharter
      tags:
        - Proyek Kanonis
      parameters:
        - name: projectId
          in: path
          required: true
          description: Identifier unik proyek (UUID v7 atau Kode Kanonis).
          schema:
            type: string
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
      responses:
        '200':
          description: Berkas biner PDF Project Charter berhasil diterbitkan.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Proyek belum berstatus REGISTERED sehingga Project Charter belum sah diterbitkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Proyek tidak ditemukan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token autentikasi JWT resmi yang diterbitkan oleh modul Identitas & Akun (F-1)."

  schemas:
    ProjectCanonicalResponse:
      type: object
      required:
        - projectId
        - projectName
        - clientId
        - clientName
        - amEmployeeId
        - amName
        - pmEmployeeId
        - pmName
        - startDate
        - targetEndDate
        - documentsComplete
        - poReceived
        - status
        - active
        - createdAt
        - updatedAt
      properties:
        projectId:
          type: string
          format: uuid
          description: Primary Key unik proyek yang diterbitkan sistem intake D-1 (format UUID v7).
          example: 01924b1e-7f32-7a81-9b12-45e8a1234567
        canonicalCode:
          type: string
          pattern: '^[0-9]{6}$'
          nullable: true
          description: Nomor proyek kanonis resmi format tahunan YYYYXX (contoh 202601) atau null jika proyek masih DRAFT/UNDER_REVIEW.
          example: "202601"
        projectName:
          type: string
          description: Nama paket inisiasi proyek resmi.
          example: Modernisasi Gedung Operasional
        clientId:
          type: string
          description: Kode referensi instansi klien dari modul CRM F-6 (atau ID draf sementara).
          example: CL-001
        clientName:
          type: string
          description: Nama lengkap perusahaan atau instansi klien pemesan.
          example: PT Cakra Infrastruktur
        amEmployeeId:
          type: string
          format: uuid
          description: Referensi ID penanggung jawab Account Manager (format UUID v7 modul F-1 / F-2).
          example: 01929b4a-6e2a-7b3f-8c71-0ab4e3d9f2a1
        amName:
          type: string
          description: Nama lengkap Account Manager penanggung jawab inisiasi komersial.
          example: Fikri Lazuardi Fadilla (AM)
        pmEmployeeId:
          type: string
          format: uuid
          description: Referensi ID pegawai Project Manager yang ditunjuk (format UUID v7 modul SDM F-2).
          example: 01929b4a-5f10-7a22-9d44-3c8f1b2e7a90
        pmName:
          type: string
          description: Nama lengkap Project Manager penerima serah terima pelaksana.
          example: Sandy Walsh
        startDate:
          type: string
          format: date
          description: Estimasi tanggal mulai administratif (ISO 8601 YYYY-MM-DD).
          example: "2026-03-01"
        targetEndDate:
          type: string
          format: date
          description: Estimasi target tanggal selesai administratif (ISO 8601 YYYY-MM-DD).
          example: "2026-08-31"
        documentsComplete:
          type: boolean
          description: Nilai sakelar (toggle switch) kelengkapan dokumen acuan kerja WI-01.
          example: true
        poReceived:
          type: boolean
          description: >-
            Flag ketersediaan dokumen fisik Purchase Order (PO). Jika bernilai false, 
            modul komersial E-2 mengunci penerbitan termin tagihan secara otomatis.
          example: true
        status:
          type: string
          enum:
            - DRAFT
            - UNDER_REVIEW
            - REVISI_HANDOVER
            - REGISTERED
          description: Siklus hidup status proyek.
          example: REGISTERED
        active:
          type: boolean
          description: Flag penanda proyek aktif (true jika status REGISTERED) untuk validasi modul governance E-5.
          example: true
        createdAt:
          type: string
          format: date-time
          description: Waktu inisiasi draf proyek dalam format ISO 8601 dengan zona WIB (+07:00).
          example: "2026-02-15T08:30:00+07:00"
        updatedAt:
          type: string
          format: date-time
          description: Waktu terakhir data diperbarui dengan zona WIB (+07:00).
          example: "2026-02-18T10:00:00+07:00"

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
        - totalPages
      properties:
        page:
          type: integer
          description: Halaman data aktif saat ini.
          example: 1
        limit:
          type: integer
          description: Batas jumlah data yang ditampilkan per halaman.
          example: 3
        total:
          type: integer
          description: Total keseluruhan data proyek yang cocok dengan filter.
          example: 4
        totalPages:
          type: integer
          description: Total jumlah halaman yang tersedia.
          example: 2

    ProjectListResponse:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProjectCanonicalResponse'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Kode error standar sistem.
          example: PROJECT_NOT_FOUND
        message:
          type: string
          description: Deskripsi pesan kesalahan yang dapat dibaca manusia.
          example: Data proyek dengan ID tersebut tidak ditemukan di sistem intake
        details:
          type: object
          description: Informasi teknis tambahan mengenai kesalahan.
          additionalProperties: true
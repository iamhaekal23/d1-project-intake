<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIMBUS ERP - Registrasi & Intake Proyek</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 min-h-screen">

  <!-- ==================== SIDEBAR KIRI (FIXED) ==================== -->
  <aside class="fixed inset-y-0 left-0 w-64 bg-[#0b1324] text-slate-300 flex flex-col justify-between z-40 border-r border-slate-800/80 select-none">
    <div>
      <!-- Brand Logo Nimbus -->
      <div class="px-6 py-5 flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-white flex items-center justify-center text-[#0b1324] shadow-sm">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3L2 8l10 5 10-5-10-5zM2 12l10 5 10-5M2 16l10 5 10-5" />
          </svg>
        </div>
        <div>
          <div class="font-bold text-white tracking-wider text-sm leading-tight">NIMBUS</div>
          <div class="text-[10px] text-slate-400 font-semibold tracking-widest uppercase">UNIVERSAL ERP</div>
        </div>
      </div>

      <!-- Menu Utama Modul D-1 -->
      <nav class="flex-1 px-3 py-4 space-y-1">
        <div class="px-3 pb-2 text-[10px] font-bold text-slate-400 uppercase tracking-wider">Menu Modul D-1</div>
        <button id="navProjectIntake" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl bg-slate-800 text-white font-medium text-xs shadow-sm transition">
          <svg class="w-4 h-4 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <span>Registrasi Proyek</span>
        </button>
      </nav>
    </div>

    <!-- Bagian Bawah Sidebar (Terintegrasi API F-1) -->
    <div class="px-4 py-4 space-y-4">
      <!-- Callout Modul D-1 -->
      <div class="bg-[#131f38] p-3.5 rounded-xl border border-slate-800">
        <div class="text-xs font-bold text-white flex items-center justify-between">
          <span>D-1 · Project Intake</span>
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" title="Sistem Aktif"></span>
        </div>
        <p class="text-[11px] text-slate-400 mt-1 leading-relaxed">Registrasi, handover, dan verifikasi proyek.</p>
      </div>

      <!-- Profil Akun Aktif (Sinkron F-1 via id) -->
      <div class="pt-3 border-t border-slate-800/80 space-y-3">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2.5 min-w-0">
            <div id="sidebarUserAvatar" class="w-8 h-8 rounded-lg bg-[#1e293b] text-cyan-400 font-bold text-xs flex items-center justify-center border border-slate-700 shrink-0">
              AM
            </div>
            <div class="min-w-0">
              <div id="sidebarUserName" class="text-xs font-bold text-white leading-tight truncate">
                Fikri Lazuardi Fadilla
              </div>
              <div id="sidebarUserRole" class="text-[10px] text-slate-400 truncate">
                Account Manager
              </div>
            </div>
          </div>
          <button id="btnLogout" class="text-slate-400 hover:text-rose-400 transition p-1.5 rounded-lg hover:bg-slate-800 shrink-0" title="Keluar / Segarkan Sesi F-1">
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
          </button>
        </div>
        <label class="block">
          <span class="block text-[10px] font-semibold text-slate-400 mb-1">Ganti akun</span>
          <select id="accountSwitcher" aria-label="Ganti akun" class="w-full bg-[#131f38] border border-slate-700 text-slate-200 text-[11px] rounded-lg px-2.5 py-2 focus:outline-none focus:ring-1 focus:ring-cyan-500">
            <option value="AM">AM · Fikri Lazuardi</option>
          </select>
        </label>
        <div>
          <button id="btnAddPmAccount" type="button" aria-controls="addPmAccountPanel" aria-expanded="false" class="w-full text-left text-[11px] font-semibold text-cyan-400 hover:text-cyan-300 transition">
            + Tambah akun PM
          </button>
          <div id="addPmAccountPanel" role="region" aria-label="Tambah akun PM" class="hidden fixed left-4 bottom-24 w-56 max-h-[calc(100vh-7rem)] overflow-y-auto p-3 space-y-2 bg-[#0b1324] border border-slate-700 rounded-xl shadow-2xl z-50">
            <select id="pmAccountCandidate" aria-label="Pilih pegawai PM" class="w-full bg-[#131f38] border border-slate-700 text-slate-200 text-[11px] rounded-lg px-2.5 py-2 focus:outline-none focus:ring-1 focus:ring-cyan-500">
              <option value="">Pilih pegawai PM</option>
            </select>
            <div class="flex space-x-2">
              <button id="btnSavePmAccount" type="button" class="flex-1 bg-cyan-700 hover:bg-cyan-600 text-white text-[10px] font-semibold rounded-lg px-2 py-2 transition">
                Tambahkan
              </button>
              <button id="btnCancelAddPmAccount" type="button" class="text-slate-400 hover:text-white text-[10px] px-2 transition">
                Batal
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ==================== AREA UTAMA ==================== -->
  <div class="ml-64 flex flex-col min-h-screen">
    
    <!-- Top Bar Sticky -->
    <header class="bg-white border-b border-slate-200/80 px-8 py-3.5 flex justify-between items-center text-xs text-slate-500 sticky top-0 z-30">
      <div class="flex items-center space-x-2">
        <span class="hover:text-slate-800 cursor-pointer font-medium" id="breadcrumbRoot">Project Intake</span>
        <span class="text-slate-400">›</span>
        <span id="breadcrumbCurrent" class="font-semibold text-slate-800">Dasbor proyek</span>
      </div>
    </header>

    <!-- Kontainer Dinamis Antarmuka -->
    <main id="appContent" class="flex-1 p-8 max-w-7xl w-full mx-auto">
      <!-- Konten dimuat secara modular oleh public/js/app.js -->
    </main>

  </div>

  <!-- Kontainer Modal Klien Sementara -->
  <div id="modalContainer"></div>

  <!-- Notifikasi Toast Global -->
  <div id="toast" class="fixed top-16 right-8 hidden bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl text-xs font-medium z-50 flex items-center space-x-2.5 border border-slate-700 transition-all duration-300">
    <span id="toastIcon" class="text-emerald-400 font-bold text-sm">✓</span>
    <span id="toastMsg">Pesan notifikasi</span>
  </div>

  <!-- Inisialisasi Script Modular -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>

<!-- MODAL OVERLAY: TAMBAH KLIEN SEMENTARA (ENT-K01-04 Sesuai UI-K01-02) -->
<div id="clientModal" class="fixed inset-0 bg-slate-900/30 hidden items-center justify-center p-4 z-50">
  <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4 border border-slate-100">
    
    <!-- Header Modal -->
    <div class="flex justify-between items-start">
      <div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
          <span>F6 CRM · KLIEN SEMENTARA</span>
        </div>
        <h3 class="text-base font-bold text-slate-900 mt-1">Tambah Klien Sementara</h3>
      </div>
      <button type="button" id="btnCloseClientModal" class="text-slate-400 hover:text-slate-600 text-lg leading-none p-1 transition">&times;</button>
    </div>

    <p class="text-xs text-slate-500 leading-relaxed">
      Buat data klien awal untuk melanjutkan registrasi. Data lengkap master instansi akan diverifikasi oleh tim CRM kemudian.
    </p>

    <!-- Isian Form Modal -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          Nama Instansi / Perusahaan <span class="text-rose-500">*</span>
        </label>
        <input type="text" id="modalClientName" placeholder="Contoh: PT Nusa Digital Solusi" class="w-full border border-slate-200 bg-slate-50/50 hover:bg-white focus:bg-white px-3.5 py-2.5 rounded-lg text-xs font-medium text-slate-800 focus:ring-1 focus:ring-slate-400 outline-none transition">
        <p id="errModalClientName" class="text-[11px] text-rose-600 font-medium mt-1 hidden"></p>
      </div>
    </div>

    <!-- Kotak Callout Klien -->
    <div class="p-3 bg-slate-50 border border-slate-200/80 rounded-xl flex items-start space-x-2.5">
      <p class="text-[11px] text-slate-500 leading-relaxed">
        Klien akan disimpan sebagai data sementara dan langsung otomatis terpilih di formulir registrasi.
      </p>
    </div>

    <!-- Tombol Aksi Modal -->
    <div class="flex justify-end space-x-2 pt-2 border-t border-slate-100">
      <button type="button" id="btnCancelClientModal" class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100 text-xs font-medium transition">
        Batal
      </button>
      <button type="button" id="btnSaveClientModal" class="px-4 py-2 rounded-lg bg-[#152a4a] hover:bg-[#0f1f38] text-white text-xs font-semibold shadow-sm transition">
        Simpan Klien
      </button>
    </div>

  </div>
</div>

<!-- MODAL OVERLAY: TAMBAH KLIEN SEMENTARA (ENT-K01-04 Sesuai UI-K01-02) -->
<div id="clientModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] hidden items-center justify-center p-4 z-50 transition-opacity">
  <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full p-7 space-y-5 border border-slate-200/80 transform transition-all">
    
    <!-- Header Modal -->
    <div class="flex justify-between items-start">
      <div>
        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider flex items-center space-x-1.5">
          <svg class="w-3.5 h-3.5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
          </svg>
          <span>F-6 CRM · KLIEN SEMENTARA</span>
        </div>
        <h3 class="text-lg font-bold text-slate-900 mt-1">Tambah Klien Sementara</h3>
      </div>
      <button type="button" id="btnCloseClientModal" class="text-slate-400 hover:text-slate-600 text-lg leading-none p-1 transition">&times;</button>
    </div>

    <p class="text-[11px] text-slate-500 leading-relaxed">
      Buat data klien awal untuk melanjutkan registrasi. Data lengkap dapat diperbarui di CRM.
    </p>

    <!-- Isian Form Modal -->
    <div class="space-y-4">
      <!-- Nama Instansi -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          Nama Instansi <span class="text-rose-500">*</span>
        </label>
        <input type="text" id="modalClientName" placeholder="PT Nusa Digital Solusi" class="w-full border border-slate-200 bg-white px-3.5 py-2.5 rounded-lg text-xs font-medium text-slate-800 focus:ring-1 focus:ring-slate-400 outline-none transition">
        <p id="errModalClientName" class="text-[11px] text-rose-600 font-medium mt-1 hidden"></p>
      </div>

      <!-- Kontak Utama -->
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">
          Kontak Utama <span class="text-rose-500">*</span>
        </label>
        <input type="text" id="modalClientContact" placeholder="Nadia Putri · 0812 8890 1245" class="w-full border border-slate-200 bg-white px-3.5 py-2.5 rounded-lg text-xs font-medium text-slate-800 focus:ring-1 focus:ring-slate-400 outline-none transition">
        <p class="text-[11px] text-slate-400 mt-1">Nama dan nomor telepon narahubung instansi.</p>
      </div>
    </div>

    <!-- Kotak Callout Klien -->
    <div class="p-3 bg-slate-50 border border-slate-200/80 rounded-xl flex items-start space-x-2.5">
      <span class="text-slate-400 text-xs leading-none mt-0.5">ⓘ</span>
      <p class="text-[11px] text-slate-500 leading-relaxed">
        Klien akan disimpan sebagai data sementara dan langsung tersedia pada pilihan klien.
      </p>
    </div>

    <!-- Tombol Aksi Modal -->
    <div class="flex justify-end space-x-2.5 pt-2">
      <button type="button" id="btnCancelClientModal" class="px-5 py-2 rounded-lg border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold transition">
        Batal
      </button>
      <button type="button" id="btnSaveClientModal" class="px-5 py-2 rounded-lg bg-[#152a4a] hover:bg-[#0f1f38] text-white text-xs font-semibold shadow-sm transition">
        Simpan
      </button>
    </div>

  </div>
</div>
